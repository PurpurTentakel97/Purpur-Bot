[project]
name = "bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.6.4",
    "twitchapi>=4.5.0",
    "dotenv>=0.9.9",
    "pydantic>=2.12.5",
    "authlib>=1.6.6",
    "httpx>=0.28.1",
    "fastapi[standard]>=0.128.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "alembic>=1.17.2",
    "poethepoet>=0.39.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
check = { cmd = "scripts/check.py" }
fix = { cmd = "scripts/check.py --fix" }
test = { cmd = "scripts/check.py --test" }

[tool.ruff]
line-length = 120

[tool.ruff.format]
preview = false

[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "I", "B", "C4", "UP", "E401", "ISC001", "ISC002", "ANN001", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
# https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
ignore = ["W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003", "COM812", "COM819", "UP045"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false
