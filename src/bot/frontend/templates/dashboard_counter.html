{% extends "base_dashboard.html" %}

{% block title %}Counter-Dashboard{% endblock %}

{% block extra_dashboard_styles %}
<style>
    .counters-table {
        margin: 1rem auto 0;
        max-width: 1200px;
        width: 100%;
        border-collapse: collapse;
        background-color: #2a2a2a;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .counters-table th, .counters-table td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid #444;
    }

    .counters-table th {
        background-color: #333;
        color: #aaa;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
    }

    .counters-table tr:last-child td {
        border-bottom: none;
    }

    .counters-table tr:hover {
        background-color: #333;
    }

    .counter-name {
        color: #9146ff;
        font-weight: bold;
    }

    .add-counter-form {
        max-width: 1200px;
        margin: 2rem auto 0;
        background-color: #2a2a2a;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        color: #aaa;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
    }

    .form-group input {
        padding: 0.75rem;
        background-color: #333;
        border: 1px solid #444;
        border-radius: 4px;
        color: white;
        font-size: 1rem;
    }

    .form-group input:focus {
        outline: none;
        border-color: #9146ff;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }

    .btn-primary {
        background-color: #9146ff;
        color: white;
    }

    .btn-primary:hover {
        background-color: #772ce8;
    }

    .btn-danger {
        background-color: #e91916;
        color: white;
    }

    .btn-danger:hover {
        background-color: #b11311;
    }

    .btn-warning {
        background-color: #ffb700;
        color: #000;
    }

    .btn-warning:hover {
        background-color: #e6a500;
    }

    .btn-small {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
    }

    .action-cell {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .inline-form {
        display: flex;
        gap: 0.5rem;
        width: 100%;
    }

    .inline-form input {
        flex: 1;
        padding: 0.4rem;
        background-color: #333;
        border: 1px solid #444;
        border-radius: 4px;
        color: white;
        font-size: 0.9rem;
    }

    .inline-form input:focus {
        outline: none;
        border-color: #9146ff;
    }
</style>
{% endblock %}


{% block dashboard_content %}
    <table class="counters-table">
        <thead>
            <tr>
                <th>Counter Name</th>
                <th>Current Value</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for counter in counters %}
            <tr>
                <td class="counter-name">
                    <form action="/dashboard/counter/{{ counter.id }}/name" method="post" class="inline-form">
                        <input type="text" name="name" value="{{ counter.name }}" required>
                        <button type="submit" class="btn btn-primary btn-small">Update</button>
                    </form>
                </td>
                <td>
                    <form action="/dashboard/counter/{{ counter.id }}/count" method="post" class="inline-form">
                        <input type="number" name="count" value="{{ counter.count }}" required>
                        <button type="submit" class="btn btn-primary btn-small">Update</button>
                    </form>
                </td>
                <td class="action-cell">
                    <form action="/dashboard/counter/{{ counter.id }}/reset" method="post" onsubmit="return confirm('Are you sure you want to reset this counter to 0?');">
                        <button type="submit" class="btn btn-warning btn-small">Reset</button>
                    </form>
                    <form action="/dashboard/counter/{{ counter.id }}/delete" method="post" onsubmit="return confirm('Are you sure you want to delete this counter?');">
                        <button type="submit" class="btn btn-danger btn-small">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center;">No counters were found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <form action="/dashboard/counter/{{ bot.id }}" method="post" class="add-counter-form">
        <div class="form-group">
            <label for="name">Counter Name:</label>
            <input type="text" id="name" name="name" placeholder="e.g. deaths" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Counter</button>
    </form>
{% endblock %}
