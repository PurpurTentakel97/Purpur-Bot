{% extends "base_dashboard.html" %}

{% block title %}Alias-Dashboard{% endblock %}

{% block extra_dashboard_styles %}
<style>
    .aliases-table {
        margin: 1rem auto 0;
        max-width: 1200px;
        width: 100%;
        border-collapse: collapse;
        background-color: #2a2a2a;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .aliases-table th, .aliases-table td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid #444;
    }

    .aliases-table th {
        background-color: #333;
        color: #aaa;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
    }

    .aliases-table tr:last-child td {
        border-bottom: none;
    }

    .aliases-table tr:hover {
        background-color: #333;
    }

    .alias-name {
        color: #9146ff;
        font-weight: bold;
    }

    .add-alias-form {
        max-width: 1200px;
        margin: 2rem auto 0;
        background-color: #2a2a2a;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        color: #aaa;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
    }

    .form-group input {
        padding: 0.75rem;
        background-color: #333;
        border: 1px solid #444;
        border-radius: 4px;
        color: white;
        font-size: 1rem;
    }

    .form-group input:focus {
        outline: none;
        border-color: #9146ff;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }

    .btn-primary {
        background-color: #9146ff;
        color: white;
    }

    .btn-primary:hover {
        background-color: #772ce8;
    }

    .btn-danger {
        background-color: #e91916;
        color: white;
    }

    .btn-danger:hover {
        background-color: #b11311;
    }

    .btn-small {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
    }

    .action-cell {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .aliases-table input {
        width: 100%;
        padding: 0.4rem;
        background-color: #333;
        border: 1px solid #444;
        border-radius: 4px;
        color: white;
        font-size: 0.9rem;
    }

    .aliases-table input:focus {
        outline: none;
        border-color: #9146ff;
    }
    /* Toggle Switch */
    .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #444;
        transition: .4s;
        border-radius: 20px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .slider {
        background-color: #9146ff;
    }

    input:checked + .slider:before {
        transform: translateX(20px);
    }
</style>
{% endblock %}


{% block dashboard_content %}
    <table class="aliases-table">
        <thead>
            <tr>
                <th>Alias</th>
                <th>Explanation</th>
                <th>Enabled</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in aliases %}
            <tr>
                <td class="alias-name">
                    <form id="update-form-{{ entry.id }}" action="/dashboard/alias/{{ bot.id }}/update/{{ entry.id }}" method="post"></form>
                    <input form="update-form-{{ entry.id }}" type="text" name="alias" value="{{ entry.alias }}" required>
                </td>
                <td>
                    <input form="update-form-{{ entry.id }}" type="text" name="explanation" value="{{ entry.explanation }}" required>
                </td>
                <td>
                    <label class="switch">
                        <input form="update-form-{{ entry.id }}" type="checkbox" name="enabled" value="True" {% if entry.enabled %}checked{% endif %}>
                        <span class="slider"></span>
                    </label>
                </td>
                <td class="action-cell">
                    <button form="update-form-{{ entry.id }}" type="submit" class="btn btn-primary btn-small">Update</button>
                    <form action="/dashboard/alias/{{ bot.id }}/{{ entry.id }}/delete" method="post" onsubmit="return confirm('Are you sure you want to delete this alias?');" style="display: inline;">
                        <button type="submit" class="btn btn-danger btn-small">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center;">No aliases were found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <form action="/dashboard/alias/{{ bot.id }}" method="post" class="add-alias-form">
        <div class="form-group">
            <label for="alias">Alias:</label>
            <input type="text" id="alias" name="alias" placeholder="e.g. kda" required>
        </div>
        <div class="form-group">
            <label for="explanation">Explanation:</label>
            <input type="text" id="explanation" name="explanation" placeholder="e.g. Kill-Death-Assist" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Alias</button>
    </form>
{% endblock %}
