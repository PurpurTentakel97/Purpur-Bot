{% extends "base_view.html" %}

{% block title %}Main - {{ bot.name }}{% endblock %}

{% block view_content %}
<div style="text-align: center;">
    <h2>Welcome to View Board from {{ bot.name }}</h2>
    <p>Please select a subpage to view details:</p>
</div>
<ul class="view-links">
    <li><a href="/view/{{ bot.id }}/commands" class="btn btn-primary">Commands</a></li>
    <li><a href="/view/{{ bot.id }}/counter" class="btn btn-primary">Counters</a></li>
    <li><a href="/view/{{ bot.id }}/alias" class="btn btn-primary">Aliases</a></li>
    <li><a href="/view/{{ bot.id }}/quote" class="btn btn-primary">Quotes</a></li>
</ul>
<ul class="view-links" style="margin-top: 1rem;">
    <li><a href="/" class="btn btn-secondary">Create your own Bot</a></li>
</ul>

<style>
    .view-links {
        list-style: none;
        padding: 0;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 2rem;
    }
    .view-links li a {
        min-width: 120px;
    }
</style>
{% endblock %}
