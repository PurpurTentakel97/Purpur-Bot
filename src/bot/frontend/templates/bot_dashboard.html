{% extends "base.html" %}

{% block content %}
    <h1>Edit Bot</h1>
    <div class="bot-list-container">
        <a href="/" class="back-link">&larr; Back to Home</a>
        <h2>Bot Settings</h2>
        <form id="edit-bot-form" class="edit-form">
            <div class="form-group">
                <label for="bot-name">Bot Name:</label>
                <input type="text" id="bot-name" name="name" value="{{ bot.name }}" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-add">Save Changes</button>
            </div>
        </form>
    </div>

    <style>
        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 500px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-weight: 600;
            color: var(--primary-color);
        }
        .form-group input {
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #0e0e10;
            color: white;
        }
        .form-group input:disabled {
            background-color: #18181b;
            color: #adadb8;
            cursor: not-allowed;
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: white;
            text-decoration: underline;
        }
    </style>

    <script>
        document.getElementById('edit-bot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;

            const formData = new FormData(e.target);
            const data = {
                name: formData.get('name')
            };

            try {
                const response = await fetch(`/api/bot/edit/{{ bot.id }}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert('Failed to save changes: ' + (error.message || 'Unknown error'));
                } else {
                    alert('Changes saved successfully!');
                }
            } catch (err) {
                alert('An error occurred while saving changes.');
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
{% endblock %}
