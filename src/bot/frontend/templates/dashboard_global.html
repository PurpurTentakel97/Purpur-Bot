{% extends "base_dashboard.html" %}

{% block title %}Main-Dashboard{% endblock %}

{% block extra_dashboard_styles %}
<style>
    .global-settings-form {
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        background-color: #2a2a2a;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        color: #aaa;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
    }

    .form-group input {
        padding: 0.75rem;
        background-color: #333;
        border: 1px solid #444;
        border-radius: 4px;
        color: white;
        font-size: 1rem;
    }

    .form-group input:focus {
        outline: none;
        border-color: #9146ff;
    }
</style>
{% endblock %}


{% block dashboard_content %}
    <form action="/dashboard/global/{{ bot.id }}" method="post" class="global-settings-form">
        <div class="form-group">
            <label for="name">Bot-Name:</label>
            <input type="text" id="name" name="name" value="{{ bot.name }}" required>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center; gap: 1rem;">
            <input type="checkbox" id="enabled" name="enabled" {% if bot.enabled %}checked{% endif %} style="width: auto;">
            <label for="enabled" style="text-transform: none; letter-spacing: normal;">Enabled</label>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
{% endblock %}
