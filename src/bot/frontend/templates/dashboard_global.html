{% extends "base_dashboard.html" %}

{% block title %}Main-Dashboard{% endblock %}

{% block extra_dashboard_styles %}
<style>
    .global-settings-form {
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        background-color: #2a2a2a;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        color: #aaa;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
    }

    .form-group input {
        padding: 0.75rem;
        background-color: #333;
        border: 1px solid #444;
        border-radius: 4px;
        color: white;
        font-size: 1rem;
    }

    .form-group input:focus {
        outline: none;
        border-color: #9146ff;
    }

    /* Toggle Switch */
    .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 26px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #444;
        transition: .4s;
        border-radius: 34px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .slider {
        background-color: #9146ff;
    }

    input:checked + .slider:before {
        transform: translateX(24px);
    }
</style>
{% endblock %}


{% block dashboard_content %}
    <form action="/dashboard/global/{{ bot.id }}" method="post" class="global-settings-form">
        <div class="form-group">
            <label for="name">Bot-Name:</label>
            <input type="text" id="name" name="name" value="{{ bot.name }}" required>
        </div>

        <div class="form-group" style="flex-direction: row; align-items: center; gap: 1rem;">
            <label class="switch">
                <input type="checkbox" id="enabled" name="enabled" value="True" {% if bot.enabled %}checked{% endif %}>
                <span class="slider"></span>
            </label>
            <span style="color: #adadb8;">Bot Enabled</span>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
{% endblock %}
